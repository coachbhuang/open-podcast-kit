name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Demo prep card passes its own checker
        run: python skills/interview-prep/scripts/check_prep_card.py examples/demo-guest/prep_v1.md
